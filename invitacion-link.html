<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Pase - Invitta Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/invitacion-link.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/env.js"></script>
</head>
<body class="link-builder-page">
  <main class="link-builder-shell">
    
    <section id="linkBuilderCard" class="link-builder-card">
      <div class="link-builder-mark">Invitta Studio</div>
      <p class="link-builder-kicker">Pase personalizado</p>
      
      <h1 id="dynamicTitle" class="link-builder-title">Generador de enlace</h1>
      <p id="dynamicMessage" class="link-builder-subtitle">Cargando configuración...</p>

      <div id="linkBuilderError" class="link-builder-error hidden" style="margin-bottom: 1.5rem;"></div>

      <!-- PANTALLA DE ERROR / DESACTIVADO -->
      <div id="disabledState" class="hidden" style="text-align: center;">
        <p class="link-builder-subtitle" style="color: #b42318; font-weight: 600;" id="disabledMessageText">El generador de enlaces no está activo para esta invitación.</p>
      </div>

      <!-- PANTALLA DE PIN -->
      <div id="pinState" class="hidden" style="text-align: center;">
        <p class="link-builder-subtitle" style="margin-bottom: 1.5rem;">Ingresa el PIN proporcionado por el estudio.</p>
        <input type="password" id="linkBuilderPinInput" style="width: 100%; box-sizing: border-box; border: 1px solid rgba(74,45,32,.16); border-radius: 1rem; padding: 1rem; text-align: center; font-size: 1.2rem; letter-spacing: .16em;" placeholder="****">
        <div id="linkBuilderPinError" style="margin-top: .8rem; color: #b42318; font-size: .9rem;" class="hidden">PIN incorrecto.</div>
        <button type="button" id="unlockLinkBuilderButton" class="link-builder-button primary" style="width: 100%; margin-top: 1.5rem;">Entrar</button>
      </div>

      <!-- PANTALLA DE GENERADOR -->
      <div id="builderState" class="hidden">
        <div id="builderForm">
        <div class="link-builder-field">
          <label for="guestName">Nombre o familia *</label>
          <input type="text" id="guestName" placeholder="Familia García" required>
        </div>

        <div class="link-builder-field">
          <label for="guestPasses">Pases</label>
          <input type="number" id="guestPasses" placeholder="4" min="1">
        </div>

        <div class="link-builder-field">
          <label for="guestTable">Mesa</label>
          <input type="text" id="guestTable" placeholder="5">
        </div>

        <div class="link-builder-field">
          <label for="guestWhatsapp">WhatsApp del invitado opcional</label>
          <input type="tel" id="guestWhatsapp" placeholder="525512345678">
        </div>

        <div class="link-builder-actions">
          <button type="button" id="generateLinkButton" class="link-builder-button primary">Generar enlace</button>
          <button type="button" id="copyLinkButton" class="link-builder-button" style="display:none;">Copiar enlace</button>
          <button type="button" id="openInvitationButton" class="link-builder-button" style="display:none;">Abrir invitación</button>
          <button type="button" id="sendWhatsappButton" class="link-builder-button" style="display:none;">Enviar por WhatsApp</button>
        </div>

        <div id="generatedLinkOutput" class="generated-link-output" style="display:none;"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/invitacion-link.js"></script>
</body>
</html>
