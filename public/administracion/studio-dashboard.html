<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · Invitta Studio</title>
  <link rel="stylesheet" href="/css/studio.css">
  <link rel="stylesheet" href="/css/studio-dashboard-v2.css">
</head>
<body>

  <div class="container">
    <div class="header">
      <div>
        <h1>Panel de Estudio</h1>
        <p id="studio-name">Cargando...</p>
      </div>
      <div class="header-actions">
        <a href="/administracion/studio-solicitudes.html" class="btn btn-secondary studio-requests-link" id="sales-requests-link">
          Solicitudes
          <span class="studio-request-count" id="sales-request-count" hidden aria-label="Solicitudes nuevas"></span>
        </a>
        <a href="/administracion/studio-invitacion-form.html" class="btn btn-primary">Crear manualmente</a>
        <a href="/administracion/generar-invitacion.html" class="btn btn-secondary" id="advanced-generator-btn" aria-label="Importar una configuración JSON existente">Importar configuración</a>
        <button id="logout-btn" class="btn btn-secondary">Cerrar Sesión</button>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-bottom: 5px;">Tus Invitaciones</h2>
      <p style="color: #666; margin-bottom: 20px;">Crea y edita tus invitaciones desde el estudio. Si ya cuentas con un respaldo JSON, puedes importarlo.</p>
      
      <div id="dashboard-filters" class="dashboard-filters" style="display: none;">
        <div class="filter-group">
          <input type="text" id="search-input" placeholder="Buscar por título o slug..." class="form-control" autocomplete="off">
        </div>
        <div class="filter-group">
          <select id="status-filter" class="form-control">
            <option value="all">Todas</option>
            <option value="published">Publicadas</option>
            <option value="draft">Borradores</option>
          </select>
        </div>
        <div class="filter-group">
          <select id="event-type-filter" class="form-control">
            <option value="all">Todos los eventos</option>
          </select>
        </div>
        <div class="filter-group">
          <button id="clear-filters-btn" class="btn btn-secondary">Limpiar</button>
        </div>
      </div>
      <div id="filter-results-msg" class="filter-results-msg" style="display: none;"></div>

      <div id="loading-msg" style="text-align: center; color: #666; padding: 20px;">
        Cargando invitaciones...
      </div>
      
      <div id="empty-msg" class="alert" style="text-align: center; display: none;">
        No tienes invitaciones creadas. ¡Empieza creando una!
      </div>
      
      <div id="invitation-list" class="invitation-list">
        <!-- Las invitaciones se cargarán aquí -->
      </div>
    </div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Variables de entorno -->
  <script src="/js/env.js"></script>
  <!-- Autenticación de Studio -->
  <script src="/js/studio-auth.js?v=studio-recovery-20260718"></script>
  <!-- Lógica del Dashboard -->
  <script src="/assets/js/invitta-templates.js"></script>
  <script src="/js/studio-dashboard.js?v=studio-recovery-20260718"></script>

</body>
</html>
