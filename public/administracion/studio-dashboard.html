<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Invitta Studio</title>
  <link rel="stylesheet" href="/css/studio.css">
  <link rel="stylesheet" href="/css/studio-dashboard-v2.css">
</head>
<body class="studio-dashboard-v2">

  <div class="studio-shell">
    
    <!-- Sidebar Lateral -->
    <aside class="studio-sidebar">
      <div class="studio-sidebar-header">
        <h2 class="studio-logo">Invitta Studio</h2>
        <p id="studio-name" class="studio-name-text">Cargando...</p>
      </div>
      
      <nav class="studio-sidebar-nav">
        <a href="#" class="studio-nav-item active">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
          Panel
        </a>
        <a href="/administracion/studio-solicitudes.html" class="studio-nav-item studio-requests-link" id="sales-requests-link">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
          Solicitudes
          <span class="studio-request-count" id="sales-request-count" hidden aria-label="Solicitudes nuevas"></span>
        </a>
      </nav>

      <div class="studio-sidebar-footer">
        <button id="logout-btn" class="studio-nav-item studio-btn-logout">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
          Cerrar Sesión
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="studio-main">
      
      <!-- Topbar -->
      <header class="studio-topbar">
        <div class="studio-topbar-title">
          <h1>Tus Invitaciones</h1>
          <p>Gestiona, crea y edita tus proyectos de eventos.</p>
        </div>
        <div class="studio-topbar-actions">
          <a href="/administracion/generar-invitacion.html" class="btn-importar" id="advanced-generator-btn" aria-label="Importar una configuración JSON existente">Importar</a>
          <a href="/administracion/studio-invitacion-form.html" class="btn-primary-v2">+ Nueva Invitación</a>
        </div>
      </header>

      <div class="studio-content-scroll">
        
        <!-- KPI Grid -->
        <section class="studio-kpi-grid">
          <div class="studio-kpi-card">
            <h3 class="kpi-label">Total Creadas</h3>
            <p class="kpi-value" id="kpi-total">0</p>
          </div>
          <div class="studio-kpi-card">
            <h3 class="kpi-label">Publicadas</h3>
            <p class="kpi-value kpi-success" id="kpi-published">0</p>
          </div>
          <div class="studio-kpi-card">
            <h3 class="kpi-label">Borradores</h3>
            <p class="kpi-value kpi-warning" id="kpi-drafts">0</p>
          </div>
        </section>

        <!-- Filtros -->
        <div id="dashboard-filters" class="dashboard-filters" style="display: none;">
          <div class="filter-group">
            <input type="text" id="search-input" placeholder="Buscar por título o slug..." class="form-control" autocomplete="off">
          </div>
          <div class="filter-group">
            <select id="status-filter" class="form-control">
              <option value="all">Todas</option>
              <option value="published">Publicadas</option>
              <option value="draft">Borradores</option>
            </select>
          </div>
          <div class="filter-group">
            <select id="event-type-filter" class="form-control">
              <option value="all">Todos los eventos</option>
            </select>
          </div>
          <div class="filter-group">
            <select id="sort-filter" class="form-control">
              <option value="recent">Más recientes primero</option>
              <option value="oldest">Más antiguas primero</option>
              <option value="date-asc">Fecha del evento próxima</option>
              <option value="date-desc">Fecha del evento lejana</option>
              <option value="a-z">A-Z</option>
              <option value="z-a">Z-A</option>
              <option value="published-first">Publicadas primero</option>
              <option value="drafts-first">Borradores primero</option>
            </select>
          </div>
          <div class="filter-group">
            <button id="clear-filters-btn" class="btn btn-secondary">Limpiar</button>
          </div>
        </div>
        <div id="filter-results-msg" class="filter-results-msg" style="display: none;"></div>

        <!-- Invitations Area -->
        <section class="studio-invitation-area">
          <div id="loading-msg" class="studio-dashboard-loading">
            <div class="spinner"></div>
            <p>Cargando invitaciones...</p>
          </div>
          
          <div id="empty-msg" class="studio-dashboard-empty" style="display: none;">
            <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            <h3>No tienes invitaciones creadas</h3>
            <p>Empieza ahora y diseña tu primer evento.</p>
          </div>
          
          <div id="invitation-list" class="studio-invitation-grid">
            <!-- JS Injection -->
          </div>
        </section>
        
      </div>
    </main>

  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Variables de entorno -->
  <script src="/js/env.js"></script>
  <!-- Autenticación de Studio -->
  <script src="/js/studio-auth.js?v=studio-recovery-20260718"></script>
  <!-- Lógica del Dashboard -->
  <script src="/assets/js/invitta-templates.js"></script>
  <script src="/js/studio-dashboard.js?v=studio-recovery-20260718"></script>

</body>
</html>
