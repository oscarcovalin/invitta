<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso | Invitta Studio</title>
  <link rel="stylesheet" href="/css/studio.css?v=studio-onboarding-1">
</head>
<body class="studio-auth-page">
  <main class="studio-auth-shell studio-login-shell">
    <a class="studio-auth-brand" href="/">Inv<span>itta</span></a>

    <section class="card studio-auth-card" aria-labelledby="login-title">
      <div class="login-header studio-auth-header">
        <p class="studio-auth-eyebrow">Invitta Studio</p>
        <h1 id="login-title">Bienvenido</h1>
        <p>Accede para crear y administrar tus invitaciones.</p>
      </div>

      <div id="login-error" class="alert alert-error" role="alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" class="form-control" autocomplete="email" required placeholder="estudio@ejemplo.com">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" class="form-control" autocomplete="current-password" required placeholder="Tu contraseña">
        </div>
        <div class="studio-auth-help-row">
          <a href="/administracion/restablecer-contrasena.html?return=studio">¿Olvidaste tu contraseña?</a>
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary studio-auth-submit">Iniciar sesión</button>
      </form>

      <div class="studio-auth-divider"><span>o</span></div>
      <a class="btn btn-secondary studio-auth-submit" href="/administracion/studio-registro.html">Crear cuenta de Studio</a>
      <p class="studio-auth-note">Después de registrarte recibirás un enlace para confirmar tu correo.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/env.js"></script>
  <script src="/js/studio-auth.js?v=studio-onboarding-1"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      await window.studioAuth.redirectIfSession();

      const form = document.getElementById("login-form");
      const errorAlert = document.getElementById("login-error");
      const submitButton = document.getElementById("submit-btn");

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        errorAlert.style.display = "none";
        submitButton.disabled = true;
        submitButton.textContent = "Iniciando...";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const { error } = await window.studioAuth.login(email, password);

        if (error) {
          errorAlert.textContent = "No pudimos iniciar sesión. Revisa tu correo, contraseña y confirmación de cuenta.";
          errorAlert.style.display = "block";
          submitButton.disabled = false;
          submitButton.textContent = "Iniciar sesión";
          return;
        }
        window.location.href = "/administracion/studio-dashboard.html";
      });
    });
  </script>
</body>
</html>
