<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso · Invitta Studio</title>
  <link rel="stylesheet" href="/css/studio.css">
</head>
<body>

  <div class="container login-container">
    <div class="card">
      <div class="login-header">
        <h1>Invitta Studio</h1>
        <p>Panel de Administración</p>
      </div>

      <div id="login-error" class="alert alert-error"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" class="form-control" required placeholder="estudio@ejemplo.com">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" class="form-control" required placeholder="********">
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          Iniciar Sesión
        </button>
      </form>
    </div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Variables de entorno -->
  <script src="/assets/js/env.js"></script>
  <!-- Autenticación de Studio -->
  <script src="/js/studio-auth.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // Si ya está logueado, redirigir al dashboard
      await window.studioAuth.redirectIfSession();

      const form = document.getElementById("login-form");
      const errorAlert = document.getElementById("login-error");
      const submitBtn = document.getElementById("submit-btn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorAlert.style.display = "none";
        submitBtn.disabled = true;
        submitBtn.textContent = "Iniciando...";

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const { data, error } = await window.studioAuth.login(email, password);

        if (error) {
          errorAlert.textContent = "Credenciales incorrectas. Revisa tu correo y contraseña.";
          errorAlert.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.textContent = "Iniciar Sesión";
        } else {
          // Login exitoso, redirigir al dashboard
          window.location.href = "/administracion/studio-dashboard.html";
        }
      });
    });
  </script>
</body>
</html>
