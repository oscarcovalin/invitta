<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Invittia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #FAF8F5;
            --card-bg: #FFFFFF;
            --border-color: #EAE4DD;
            --text-main: #111111;
            --text-muted: #6B6560;
            --accent: #D4AF37;
            --status-conf: #4CAF50;
            --status-pend: #FF9800;
            --status-no: #E53935;
            --sans: 'Inter', sans-serif;
            --serif: 'Playfair Display', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--sans); background-color: var(--bg-color); color: var(--text-main); }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        
        /* HEADER */
        header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 16px 0; }
        .header-inner { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: var(--serif); font-size: 1.5rem; font-weight: 600; text-decoration: none; color: var(--text-main); }
        .logo em { font-style: italic; color: var(--accent); }
        .user-profile { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; font-weight: 500; }
        .avatar { width: 36px; height: 36px; background: var(--border-color); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: var(--text-main); }

        /* EVENT SUMMARY */
        .event-summary { padding: 48px 0 32px; }
        .event-title { font-family: var(--serif); font-size: 2.5rem; margin-bottom: 8px; }
        .event-meta { font-size: 0.95rem; color: var(--text-muted); display: flex; gap: 16px; align-items: center; }
        .event-meta span { display: flex; align-items: center; gap: 6px; }

        /* METRICS */
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .metric-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .metric-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
        .metric-value { font-size: 2.2rem; font-weight: 500; font-family: var(--serif); }
        
        .metric-card.conf .metric-value { color: var(--status-conf); }
        .metric-card.pend .metric-value { color: var(--status-pend); }
        .metric-card.no .metric-value { color: var(--status-no); }

        /* CONTROLS */
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 16px; }
        .search-box { position: relative; width: 300px; }
        .search-box input { width: 100%; padding: 12px 16px 12px 40px; border: 1px solid var(--border-color); border-radius: 8px; font-family: var(--sans); outline: none; transition: border-color 0.3s; }
        .search-box input:focus { border-color: var(--accent); }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        
        .filters { display: flex; gap: 8px; }
        .filter-btn { padding: 8px 16px; border: 1px solid var(--border-color); background: var(--card-bg); border-radius: 20px; font-family: var(--sans); font-size: 0.85rem; cursor: pointer; transition: all 0.2s; color: var(--text-muted); font-weight: 500; }
        .filter-btn.active { background: var(--text-main); color: #fff; border-color: var(--text-main); }
        
        .export-btn { padding: 10px 20px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; font-family: var(--sans); font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s; font-weight: 500; }
        .export-btn:hover { border-color: var(--text-main); }

        /* TABLE */
        .table-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.02); margin-bottom: 60px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 16px 24px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); border-bottom: 1px solid var(--border-color); font-weight: 600; background: #fafafa; }
        td { padding: 16px 24px; font-size: 0.95rem; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: #fdfdfd; }
        
        .guest-name { font-weight: 500; color: var(--text-main); }
        .guest-family { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
        
        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .status-badge.conf { background: #E8F5E9; color: var(--status-conf); }
        .status-badge.pend { background: #FFF3E0; color: var(--status-pend); }
        .status-badge.no { background: #FFEBEE; color: var(--status-no); }
        
        .qr-btn { color: var(--text-main); background: none; border: 1px solid var(--border-color); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
        .qr-btn:hover { border-color: var(--text-main); }

        /* EMPTY STATE */
        .empty-state { padding: 40px; text-align: center; color: var(--text-muted); display: none; }

        @media (max-width: 768px) {
            .controls { flex-direction: column; align-items: stretch; }
            .search-box { width: 100%; }
            .filters { overflow-x: auto; padding-bottom: 8px; }
            .table-container { overflow-x: auto; }
            .event-title { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="container header-inner">
            <a href="../index.html" class="logo">Inv<em>itta</em></a>
            <div class="user-profile">
                <div class="avatar">P</div>
                <span>Paulina & Roy</span>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="event-summary">
            <h1 class="event-title">Boda de Paulina & Roy</h1>
            <div class="event-meta">
                <span><i class="fa-regular fa-calendar"></i> 15 Noviembre 2026</span>
                <span><i class="fa-solid fa-user-group"></i> 118 Invitados</span>
                <span><i class="fa-solid fa-check-circle" style="color:var(--status-conf);"></i> 84 Confirmados</span>
            </div>
        </section>

        <section class="metrics">
            <div class="metrics-grid">
                <div class="metric-card conf">
                    <div class="metric-label">Confirmados</div>
                    <div class="metric-value" id="count-conf">84</div>
                </div>
                <div class="metric-card pend">
                    <div class="metric-label">Pendientes</div>
                    <div class="metric-value" id="count-pend">23</div>
                </div>
                <div class="metric-card no">
                    <div class="metric-label">No Asistirán</div>
                    <div class="metric-value" id="count-no">11</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Total Invitados</div>
                    <div class="metric-value">118</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Acompañantes</div>
                    <div class="metric-value">47</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Mesas Asig.</div>
                    <div class="metric-value">15</div>
                </div>
            </div>
        </section>

        <section class="guest-management">
            <div class="controls">
                <div class="search-box">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Buscar invitado o familia...">
                </div>
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">Todos</button>
                    <button class="filter-btn" data-filter="Confirmado">Confirmados</button>
                    <button class="filter-btn" data-filter="Pendiente">Pendientes</button>
                    <button class="filter-btn" data-filter="No asistirá">No asistirán</button>
                </div>
                <button class="export-btn" id="exportBtn">
                    <i class="fa-solid fa-download"></i> Exportar CSV
                </button>
            </div>

            <div class="table-container">
                <table id="guestsTable">
                    <thead>
                        <tr>
                            <th>Invitado</th>
                            <th>Estado</th>
                            <th>Acompañantes</th>
                            <th>Mesa</th>
                            <th>Código QR</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- JS renders rows here -->
                    </tbody>
                </table>
                <div class="empty-state" id="emptyState">No se encontraron invitados.</div>
            </div>
        </section>
    </main>

    <script>
        // Simulando Base de Datos (con campos adicionales para el CSV)
        const guests = [
            { id: 1, name: "Juan Pérez", family: "Familia Pérez López", status: "Confirmado", companions: 3, table: 12, email: "juan@example.com", phone: "555-0101", date: "2026-08-10" },
            { id: 2, name: "María Gómez", family: "Familia Gómez", status: "Pendiente", companions: 1, table: "-", email: "maria@example.com", phone: "555-0102", date: "-" },
            { id: 3, name: "Carlos Slim", family: "Familia Slim", status: "Confirmado", companions: 4, table: 1, email: "carlos@example.com", phone: "555-0103", date: "2026-08-11" },
            { id: 4, name: "Ana Martínez", family: "Familia Martínez", status: "No asistirá", companions: 0, table: "-", email: "ana@example.com", phone: "555-0104", date: "2026-08-12" },
            { id: 5, name: "Roberto Torres", family: "Familia Torres", status: "Confirmado", companions: 2, table: 12, email: "roberto@example.com", phone: "555-0105", date: "2026-08-13" },
            { id: 6, name: "Laura Sánchez", family: "Familia Sánchez", status: "Pendiente", companions: 2, table: "-", email: "laura@example.com", phone: "555-0106", date: "-" },
            { id: 7, name: "Diego Fernández", family: "Familia Fernández", status: "Confirmado", companions: 1, table: 5, email: "diego@example.com", phone: "555-0107", date: "2026-08-14" },
            { id: 8, name: "Sofía Ruiz", family: "Familia Ruiz", status: "Confirmado", companions: 0, table: 5, email: "sofia@example.com", phone: "555-0108", date: "2026-08-15" }
        ];

        const tbody = document.getElementById('tableBody');
        const emptyState = document.getElementById('emptyState');
        let currentFilter = 'all';
        let currentSearch = '';

        function getStatusClass(status) {
            if(status === 'Confirmado') return 'conf';
            if(status === 'Pendiente') return 'pend';
            if(status === 'No asistirá') return 'no';
            return '';
        }

        function renderTable() {
            tbody.innerHTML = '';
            
            const filteredGuests = guests.filter(g => {
                const matchesFilter = currentFilter === 'all' || g.status === currentFilter;
                const searchLower = currentSearch.toLowerCase();
                const matchesSearch = g.name.toLowerCase().includes(searchLower) || g.family.toLowerCase().includes(searchLower);
                return matchesFilter && matchesSearch;
            });

            if (filteredGuests.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                filteredGuests.forEach(g => {
                    const statusClass = getStatusClass(g.status);
                    const statusIcon = g.status === 'Confirmado' ? 'fa-check' : (g.status === 'Pendiente' ? 'fa-clock' : 'fa-xmark');
                    
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>
                            <div class="guest-name">${g.name}</div>
                            <div class="guest-family">${g.family}</div>
                        </td>
                        <td>
                            <span class="status-badge ${statusClass}"><i class="fa-solid ${statusIcon}"></i> ${g.status}</span>
                        </td>
                        <td>${g.companions}</td>
                        <td>${g.table}</td>
                        <td>
                            ${g.status === 'Confirmado' ? '<button class="qr-btn"><i class="fa-solid fa-qrcode"></i> Ver QR</button>' : '<span style="color:#A09A94;font-size:0.85rem;">No disp.</span>'}
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            }
        }

        // Search Logic
        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentSearch = e.target.value;
            renderTable();
        });

        // Filter Logic
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.getAttribute('data-filter');
                renderTable();
            });
        });

        // Export CSV Logic
        document.getElementById('exportBtn').addEventListener('click', () => {
            const headers = ['Nombre', 'Familia', 'Estado', 'Acompañantes', 'Mesa', 'Email', 'Teléfono', 'Fecha Confirmación'];
            let csvContent = headers.join(',') + '\\n';

            guests.forEach(g => {
                const row = [
                    `"${g.name}"`, 
                    `"${g.family}"`, 
                    `"${g.status}"`, 
                    g.companions, 
                    `"${g.table}"`, 
                    `"${g.email}"`, 
                    `"${g.phone}"`, 
                    `"${g.date}"`
                ];
                csvContent += row.join(',') + '\\n';
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "invitados_paulina_roy.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // Init
        renderTable();
    </script>
</body>
</html>
