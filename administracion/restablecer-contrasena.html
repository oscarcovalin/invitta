<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña - Invitta</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/env.js"></script>
    <script src="../assets/js/supabase-client.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #faf8f5; --card-bg: #fff; --border-color: #eae4dd; --text-main: #111; --text-muted: #6b6560; --accent: #d4af37; --error: #b3261e; --success: #256b4f; --sans: 'Inter', sans-serif; --serif: 'Playfair Display', serif; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg-color); color: var(--text-main); font-family: var(--sans); }
        .shell { width: 100%; max-width: 420px; }
        .logo { display: inline-block; margin-bottom: 28px; color: var(--text-main); font-family: var(--serif); font-size: 1.8rem; font-weight: 600; text-decoration: none; }
        .logo em { color: var(--accent); font-style: italic; }
        .card { border: 1px solid var(--border-color); border-radius: 16px; padding: 32px; background: var(--card-bg); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02); }
        h1 { margin-bottom: 8px; font-family: var(--serif); font-size: 2rem; font-weight: 600; }
        .intro { margin-bottom: 24px; color: var(--text-muted); font-size: 0.95rem; line-height: 1.55; }
        label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.8rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
        input { width: 100%; padding: 13px 14px; border: 1px solid var(--border-color); border-radius: 8px; background: #fff; color: var(--text-main); font: inherit; outline: none; }
        input:focus { border-color: var(--accent); }
        .field { margin-bottom: 18px; }
        .notice { display: none; margin-bottom: 18px; padding: 12px 14px; border-radius: 8px; font-size: 0.9rem; line-height: 1.45; }
        .notice.active { display: block; }
        .notice.error { background: #fceeee; color: var(--error); }
        .notice.success { background: #e9f6ee; color: var(--success); }
        .button { width: 100%; padding: 14px; border: 0; border-radius: 8px; background: var(--text-main); color: #fff; cursor: pointer; font: inherit; font-weight: 500; }
        .button:disabled { cursor: not-allowed; opacity: 0.65; }
        .back { display: block; width: fit-content; margin: 18px auto 0; color: var(--text-muted); font-size: 0.9rem; text-decoration: underline; text-underline-offset: 3px; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main class="shell">
        <a href="../index.html" class="logo">Inv<em>itta</em></a>
        <section class="card">
            <div id="notice" class="notice" role="status" aria-live="polite"></div>

            <div id="requestPanel">
                <h1>Recuperar acceso</h1>
                <p class="intro">Escribe tu correo y te enviaremos un enlace para crear una contrasena nueva.</p>
                <form id="requestForm" novalidate>
                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" autocomplete="email" required>
                    </div>
                    <button class="button" id="requestButton" type="submit">Enviar enlace de recuperacion</button>
                </form>
            </div>

            <div id="passwordPanel" hidden>
                <h1>Crea tu contrasena</h1>
                <p class="intro">Elige una contrasena nueva de al menos 8 caracteres.</p>
                <form id="passwordForm" novalidate>
                    <div class="field">
                        <label for="newPassword">Contraseña nueva</label>
                        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" required>
                    </div>
                    <div class="field">
                        <label for="confirmPassword">Confirmar contrasena</label>
                        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
                    </div>
                    <button class="button" id="passwordButton" type="submit">Guardar contrasena nueva</button>
                </form>
            </div>

            <a class="back" href="login.html">Volver al acceso</a>
        </section>
    </main>
    <script src="../assets/js/password-recovery.js"></script>
</body>
</html>
